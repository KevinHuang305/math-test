<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>進階數學練習產生器 (密碼保護版)</title>
    <style>
        :root { --primary: #4a90e2; --success: #28a745; --danger: #dc3545; --warning: #f39c12; }
        body { font-family: 'PingFang TC', 'Microsoft JhengHei', sans-serif; background: #f0f2f5; margin: 0; padding: 20px; display: flex; justify-content: center; }
        .container { background: white; padding: 25px; border-radius: 15px; box-shadow: 0 10px 25px rgba(0,0,0,0.1); width: 100%; max-width: 800px; }
        h1 { text-align: center; color: #333; margin-bottom: 20px; }
        
        .settings-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 15px; background: #f8f9fa; padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #ddd; }
        .setting-group { border: 1px solid #eee; padding: 10px; border-radius: 8px; background: white; }
        .setting-group h3 { margin: 0 0 10px 0; font-size: 1rem; color: var(--primary); border-bottom: 2px solid #f0f2f5; }
        .setting-item { display: flex; align-items: center; margin-bottom: 5px; font-size: 0.9rem; }
        .setting-item label { flex: 1; }
        .setting-item input[type="number"] { width: 50px; padding: 3px; border: 1px solid #ccc; border-radius: 4px; }
        
        .mode-switch { grid-column: span 2; display: flex; justify-content: center; gap: 20px; padding-bottom: 10px; border-bottom: 2px solid #eee; margin-bottom: 10px; }
        
        .question-list { margin-top: 20px; }
        .question-item { display: flex; align-items: center; padding: 12px; border-bottom: 1px solid #eee; font-size: 1.2rem; flex-wrap: wrap; }
        .q-num { width: 30px; font-weight: bold; color: #888; }
        .q-text { flex-grow: 1; min-width: 200px; }
        .q-input { width: 120px; padding: 6px; font-size: 1.1rem; border: 2px solid #ddd; border-radius: 6px; }
        
        .controls { display: flex; gap: 10px; justify-content: center; margin-top: 20px; flex-wrap: wrap; }
        button { padding: 12px 20px; border-radius: 8px; border: none; cursor: pointer; font-weight: bold; font-size: 1rem; transition: 0.2s; min-width: 120px; }
        .btn-gen { background: var(--primary); color: white; }
        .btn-check { background: var(--success); color: white; }
        .btn-reveal { background: var(--warning); color: white; }
        button:hover { opacity: 0.9; transform: translateY(-1px); }
        
        .feedback { margin: 0 10px; width: 25px; }
        .ans-hint { color: #e67e22; font-size: 0.9rem; margin-left: 10px; display: none; font-weight: bold; }
        #score-board { text-align: center; font-size: 1.5rem; margin-top: 20px; color: var(--primary); font-weight: bold; }
        .hint-text { font-size: 0.8rem; color: #999; text-align: center; margin-top: 5px; }
    </style>
</head>
<body>

<div class="container">
    <h1>🎯 數學練習產生器 (密碼保護)</h1>

    <div class="settings-grid">
        <div class="mode-switch">
            <label><input type="radio" name="mainMode" value="int" checked onchange="toggleMode()"> 整數模式</label>
            <label><input type="radio" name="mainMode" value="frac" onchange="toggleMode()"> 分數模式 (需最簡化)</label>
        </div>

        <div id="int-settings" style="grid-column: span 2; display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="setting-group">
                <h3>➕ 加法 / ➖ 減法</h3>
                <div class="setting-item"><label>左項位數：</label> <input type="number" id="add_d1" value="2" min="1"></div>
                <div class="setting-item"><label>右項位數：</label> <input type="number" id="add_d2" value="2" min="1"></div>
            </div>
            <div class="setting-group">
                <h3>✖️ 乘法</h3>
                <div class="setting-item"><label>左項位數：</label> <input type="number" id="mul_d1" value="2" min="1"></div>
                <div class="setting-item"><label>右項位數：</label> <input type="number" id="mul_d2" value="1" min="1"></div>
            </div>
            <div class="setting-group">
                <h3>➗ 除法 (保證整除)</h3>
                <div class="setting-item"><label>除數位數：</label> <input type="number" id="div_d2" value="1" min="1"></div>
                <div class="setting-item"><label>商的位數：</label> <input type="number" id="div_q" value="2" min="1"></div>
            </div>
            <div class="setting-group">
                <h3>題數與類型</h3>
                <div class="setting-item"><label>總題數：</label> <input type="number" id="q_count" value="10" min="1"></div>
                <div class="setting-item">
                    <label><input type="checkbox" class="op-type" value="+" checked>+</label>
                    <label><input type="checkbox" class="op-type" value="-" checked>-</label>
                    <label><input type="checkbox" class="op-type" value="*" checked>×</label>
                    <label><input type="checkbox" class="op-type" value="/" checked>÷</label>
                </div>
            </div>
        </div>

        <div id="frac-settings" style="grid-column: span 2; display: none;">
            <div class="setting-group">
                <h3>分數設定 (a/b)</h3>
                <div class="setting-item"><label>分母最大值：</label> <input type="number" id="frac_max" value="10" min="2"></div>
                <p class="hint-text">註：答案格式為 "1/2" 或 "3"。</p>
            </div>
        </div>
    </div>

    <div class="controls">
        <button class="btn-gen" onclick="generate()">開始出題</button>
        <button class="btn-check" onclick="check()">批改作答</button>
        <button class="btn-reveal" onclick="askPasswordToReveal()">顯示/隱藏答案</button>
    </div>

    <div id="quizContainer" class="question-list"></div>
    <div id="score-board"></div>
</div>

<script>
    let questions = [];
    let isRevealed = false; // 目前答案是否顯示狀態
    const SECRET_PASSWORD = "3131";

    function toggleMode() {
        const mode = document.querySelector('input[name="mainMode"]:checked').value;
        document.getElementById('int-settings').style.display = mode === 'int' ? 'grid' : 'none';
        document.getElementById('frac-settings').style.display = mode === 'frac' ? 'block' : 'none';
    }

    function randByDigits(d) {
        const min = Math.pow(10, d - 1);
        const max = Math.pow(10, d) - 1;
        return Math.floor(Math.random() * (max - min + 1)) + min;
    }

    function gcd(a, b) { return b === 0 ? Math.abs(a) : gcd(b, a % b); }

    function simplify(num, den) {
        const common = gcd(num, den);
        num /= common; den /= common;
        if (den < 0) { num = -num; den = -den; }
        return [num, den];
    }

    function generate() {
        // 重置狀態
        isRevealed = false; 
        const container = document.getElementById('quizContainer');
        const mode = document.querySelector('input[name="mainMode"]:checked').value;
        const count = parseInt(document.getElementById('q_count').value) || 10;
        
        container.innerHTML = '';
        questions = [];
        document.getElementById('score-board').innerHTML = '';

        const ops = Array.from(document.querySelectorAll('.op-type:checked')).map(el => el.value);
        if (ops.length === 0 && mode === 'int') { alert('請至少勾選一種運算類型'); return; }

        for (let i = 0; i < count; i++) {
            let qText = '', ansStr = '';

            if (mode === 'int') {
                const op = ops[Math.floor(Math.random() * ops.length)];
                let n1, n2, res;
                if (op === '+') {
                    n1 = randByDigits(parseInt(document.getElementById('add_d1').value));
                    n2 = randByDigits(parseInt(document.getElementById('add_d2').value));
                    res = n1 + n2;
                } else if (op === '-') {
                    n1 = randByDigits(parseInt(document.getElementById('add_d1').value));
                    n2 = randByDigits(parseInt(document.getElementById('add_d2').value));
                    if (n1 < n2) [n1, n2] = [n2, n1];
                    res = n1 - n2;
                } else if (op === '*') {
                    n1 = randByDigits(parseInt(document.getElementById('mul_d1').value));
                    n2 = randByDigits(parseInt(document.getElementById('mul_d2').value));
                    res = n1 * n2;
                } else if (op === '/') {
                    const d2 = randByDigits(parseInt(document.getElementById('div_d2').value));
                    const quotient = randByDigits(parseInt(document.getElementById('div_q').value));
                    n2 = d2; n1 = d2 * quotient; res = quotient;
                }
                qText = `${n1} ${op.replace('*','×').replace('/','÷')} ${n2} = `;
                ansStr = res.toString();
            } else {
                const op = ['+', '-', '*', '/'][Math.floor(Math.random() * 4)];
                const maxV = parseInt(document.getElementById('frac_max').value);
                let d1 = Math.floor(Math.random() * (maxV - 1)) + 2, n1 = Math.floor(Math.random() * maxV) + 1;
                let d2 = Math.floor(Math.random() * (maxV - 1)) + 2, n2 = Math.floor(Math.random() * maxV) + 1;
                let resN, resD;
                if (op === '+') { resN = n1 * d2 + n2 * d1; resD = d1 * d2; }
                else if (op === '-') { resN = n1 * d2 - n2 * d1; resD = d1 * d2; }
                else if (op === '*') { resN = n1 * n2; resD = d1 * d2; }
                else if (op === '/') { resN = n1 * d2; resD = d1 * n2; }
                const [fN, fD] = simplify(resN, resD);
                ansStr = fD === 1 ? fN.toString() : `${fN}/${fD}`;
                qText = `(${n1}/${d1}) ${op.replace('*','×').replace('/','÷')} (${n2}/${d2}) = `;
            }

            questions.push(ansStr);
            const item = document.createElement('div');
            item.className = 'question-item';
            item.innerHTML = `
                <span class="q-num">${i + 1}.</span>
                <span class="q-text">${qText}</span>
                <input type="text" class="q-input" id="input-${i}">
                <span class="feedback" id="feed-${i}"></span>
                <span class="ans-hint" id="hint-${i}"> (答: ${ansStr})</span>
            `;
            container.appendChild(item);
        }
    }

    function check() {
        let score = 0;
        questions.forEach((ans, i) => {
            const userAns = document.getElementById(`input-${i}`).value.trim().replace(/\s/g, '');
            const feed = document.getElementById(`feed-${i}`);
            if (userAns === ans.replace(/\s/g, '')) {
                feed.innerHTML = '✅';
                feed.style.color = 'var(--success)';
                score++;
            } else {
                feed.innerHTML = '❌';
                feed.style.color = 'var(--danger)';
            }
        });
        document.getElementById('score-board').innerText = `得分：${score} / ${questions.length}`;
    }

    // 密碼驗證與顯示切換
    function askPasswordToReveal() {
        // 如果目前是顯示狀態，直接切換成隱藏，不需密碼
        if (isRevealed) {
            applyReveal(false);
            return;
        }

        // 如果要從隱藏變顯示，要求密碼
        const pwd = prompt("請輸入管理員密碼以顯示答案：");
        if (pwd === SECRET_PASSWORD) {
            applyReveal(true);
        } else if (pwd !== null) {
            alert("密碼錯誤，無法顯示答案！");
        }
    }

    function applyReveal(show) {
        isRevealed = show;
        const hints = document.querySelectorAll('.ans-hint');
        hints.forEach(el => {
            el.style.display = show ? 'inline' : 'none';
        });
    }

    window.onload = generate;
</script>

</body>
</html>
